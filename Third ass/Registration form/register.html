<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION</title>
    <link rel="stylesheet"href="style2.css">
</head>
<body>
    <form onsubmit="return validateForm()"method="POST"action="cave.php">
            <h2>Student Registration</h2>
    <label>Lastname: <input type='text' name='lastname'></label><br>
    <label>Course:
      <select name='course'>
        <option>Course</option>
        <option>Computer Engineering</option>
        <option>Software Engineering</option>
      </select>
    </label><br>
    <label>Gender:</label>
    <input type='radio' name='gender' value='male'> Male
    <input type='radio' name='gender' value='female'> Female
    <input type='radio' name='gender' value='other'> Other<br>
    <label>Phone: +91 <input type='text' name='phone'></label><br>
    <label>Address:<br>
    <textarea name='address' rows='4' cols='40'></textarea></label><br>
    <label>Email: <input type='email' name='email'></label><br>
    <label>Password: <input type='password' name='pwd' id='pwd'></label><br>
    <label>Re-type password: <input type='password' name='pwd2' id='pwd2'></label><br>
    <input type='submit' value='Submit'>

    </form>

<script>
    function validateForm() {
      var p1 = document.getElementById('pwd').value;
      var p2 = document.getElementById('pwd2').value;
      if (p1 !== p2) {
        alert('Passwords do not match!');
        return false;
      }
      return true;
    }
  </script>

    
</body>
</html>
